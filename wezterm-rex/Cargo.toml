[package]
name = "wezterm-rex"
version = "0.1.0"
edition = "2024"
license = "MIT"


[dependencies]
anyhow = "1"
base64 = "0.22"
flume = "0.11"
futures-util = { version = "0.3", features = ["sink"] }
ghostty-vt = { version = "=0.8.0", features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync", "io-util", "fs"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
url = "2"
ring = "0.17"
wezterm-term = { path = "../term" }
termwiz = { workspace = true, features = ["use_image"] }

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
